<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="var.css">

	<title>Trench</title>
</head>
<body>
	<h1 class="page-padding">Sticks n trenches</h1>
	<section class="header nav page-padding flex-row">
		<div class="grow">
			<span class="hidden">difficulty:</span>
			<select name="difficulty" id="difficulty" class="hidden">
				<option value="0">normal</option>
				<option value="1">hard</option>
				<option value="2">tryhard</option>
				<option value="3">impossible</option>
			</select>

			<span>level:</span>
			<select name="levels" id="levels"></select>
		</div>

		<div>
			<span>Money: <b id="money">100$</b></span>
		</div>
	</section>

	<section>
		<div id="canvas-wrapper">
			<canvas id="canv-terrain"></canvas>
			<canvas id="canv-main"></canvas>
			<div class="winscreen flex-col justify-center items-center hidden" id="winscreen">
				<h2>Victory !</h2>
				<button id="level-continue">Continue</button>
			</div>
		</div>
	</section>

	<section class="nav-bottom nav page-padding flex-row">
		<div id="inventory" class="game-inventory flex-row gap-2">

		</div>

		<div class="game-actions flex-row grow justify-end gap-1 items-stretch">
			<button class="btn-direction" value="-1">Backwards</button>
			<button class="btn-direction" value="1">Forward</button>
		</div>
	</section>

	<script src="scripts/helper/targeting.js"></script>
	<script src="scripts/helper/formatdata.js"></script>

	<script src="scripts/data/enum.js"></script>
	<script src="scripts/data/config.js"></script>
	<script src="scripts/data/spritesheets.js"></script>
	<script src="scripts/data/stats.js"></script>
	<script src="scripts/data/terrain.js"></script>
	<script src="scripts/data/levels.js"></script>

	<script src="scripts/core/canvas.js"></script>
	<script src="scripts/core/gameLoop.js"></script>

	<script src="scripts/utility/cEvent.js"></script>
	<script src="scripts/utility/cImageAsset.js"></script>
	<script src="scripts/utility/cTimer.js"></script>
	<script src="scripts/utility/sound.js"></script>
	<script src="scripts/utility/soundtrack.js"></script>

	<script src="scripts/engine/camera.js"></script>
	<script src="scripts/engine/cProjectileManager.js"></script>
	<script src="scripts/engine/cStrokeManager.js"></script>
	<script src="scripts/engine/cTilemap.js"></script>

	<script src="scripts/sprite/animations.js"></script>
	<script src="scripts/sprite/cAnimationController.js"></script>
	<script src="scripts/sprite/cVFX.js"></script>

	<script src="scripts/session/cEntity.js"></script>
	<script src="scripts/session/cEntityManager.js"></script>
	<script src="scripts/session/cTeamManager.js"></script>
	<script src="scripts/session/cMap.js"></script>
	<script src="scripts/session/cGameSession.js"></script>

	<script src="scripts/slots.js" type="module"></script>
	<script src="scripts/main.js" type="module"></script>
</body>
</html>
